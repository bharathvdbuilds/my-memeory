<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mylavaram Constructions — Designed. Engineered. Built. Civil, commercial and industrial construction, architecture collaboration, and development partnership opportunities."
    />
    <meta name="theme-color" content="#171C22" />
    <meta property="og:title" content="Mylavaram Constructions" />
    <meta
      property="og:description"
      content="Building Strong Foundations. Creating Bigger Possibilities."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Mylavaram Constructions | Designed. Engineered. Built.</title>
    <script>
      /* GitHub Pages serves this source folder at /mylavaram-constructions/ and the
         module script below 404s there, so the directory opens blank. Send that
         visit to the built site. Vite dev uses "/" and the published build uses
         "/mylavaram/", so neither of those paths is redirected. */
      (function () {
        var path = location.pathname;
        if (/\/mylavaram-constructions\/(?:index\.html)?$/.test(path)) {
          location.replace(path.replace(/mylavaram-constructions\/(?:index\.html)?$/, "mylavaram/"));
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family:system-ui,sans-serif;padding:24px">
        The live site is <a href="../mylavaram/">Mylavaram Constructions</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
